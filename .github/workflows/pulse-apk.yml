name: Build PULSE Android APK

on:
  push:
    branches:
      - pulse-android-apk
    paths:
      - 'pulse/**'
      - '.github/workflows/pulse-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --licenses > /dev/null || true
      - name: Install SDK 35
        run: /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble APK
        working-directory: pulse/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Rename APK
        run: cp pulse/android/app/build/outputs/apk/debug/app-debug.apk PULSE-v1.0-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-v1.0-debug-apk
          path: PULSE-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
