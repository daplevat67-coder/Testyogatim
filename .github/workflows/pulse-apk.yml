name: Build PULSE Android APK

on:
  push:
    branches:
      - pulse-android-apk
    paths:
      - 'pulse/**'
      - '.github/workflows/pulse-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build signed debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test rep counting logic
        working-directory: pulse/android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Assemble APK
        working-directory: pulse/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify Android APK signatures
        run: |
          APK=pulse/android/app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Rename APK
        run: cp pulse/android/app/build/outputs/apk/debug/app-debug.apk PULSE-v1.2.0-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-v1.2.0-debug-apk
          path: PULSE-v1.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
