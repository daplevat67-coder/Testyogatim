ter-spacing:-1.3px}.stat-card span{font-size:11px;color:var(--muted);line-height:1.4;display:block;margin-top:7px}.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;margin-top:19px}.week-day{display:grid;gap:7px;text-align:center;justify-items:center;color:var(--muted);font-size:11px}.week-column{height:90px;width:100%;display:flex;align-items:end;justify-content:center}.week-column span{display:block;width:100%;max-width:35px;height:var(--height,10%);min-height:6px;background:#384047;border-radius:9px 9px 4px 4px}.week-column span.active{background:linear-gradient(180deg,var(--lime),#7ba746)}.week-day.today{color:var(--lime)}.history{display:grid;gap:9px;margin-top:15px}.history-item{background:#1d242b;border:1px solid #303841;border-radius:17px;padding:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}.history-item strong{font-size:13px;display:block;margin-bottom:5px}.history-item small{font-size:11px;color:var(--muted)}.history-item .history-tag{font-size:11px;background:#293a2c;color:var(--lime);border-radius:10px;padding:8px 10px;white-space:nowrap}.empty{text-align:center;padding:28px 13px;color:var(--muted);font-size:13px;line-height:1.6}.setting-row{margin-top:18px}.setting-row:first-child{margin-top:0}.setting-row-head{display:flex;justify-content:space-between;gap:12px}.setting-row-head strong{font-size:14px}.setting-row-head span{color:var(--lime);font-weight:800}.helper{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}.action-btn{border-radius:14px;padding:13px 16px;font-weight:780;background:#29333a;color:var(--text);border:1px solid #3d4852;margin-top:12px;width:100%;text-align:left}.action-btn.danger{color:#ffc5af;background:#342729;border-color:#62413f}.credits{color:#65767b;font-size:11px;text-align:center;margin-top:29px;line-height:1.7}.toast{position:fixed;bottom:103px;left:50%;transform:translate(-50%,15px);background:#deffa9;color:#202b16;border-radius:15px;padding:12px 17px;font-size:13px;font-weight:790;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:min(90vw,460px);z-index:20;box-shadow:0 14px 40px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:15;display:flex;justify-content:center;gap:0;background:#11151bf2;backdrop-filter:blur(18px);border-top:1px solid #2a3238;padding:9px max(14px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom));box-shadow:0 -9px 40px #0004}.nav-item{min-width:90px;max-width:180px;flex:1;color:#84929b;background:none;border:0;display:grid;justify-items:center;gap:4px;font-size:10px;font-weight:720;padding:4px 0}.nav-item.active{color:var(--lime)}.nav-icon{height:25px;display:grid;place-items:center}.nav-icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;background:#06080ac9;z-index:60;display:grid;place-items:center;padding:22px;backdrop-filter:blur(12px)}.modal{width:min(100%,400px);padding:31px 23px;background:#1e2828;border:1px solid #6e8861;border-radius:28px;text-align:center;box-shadow:0 30px 90px #000a}.modal .celebrate{font-size:52px;display:block;margin-bottom:15px}.modal h2{font-size:27px}.modal p{color:#bfccc2;font-size:14px;line-height:1.6;margin-top:12px}.modal button{background:var(--lime);color:#162017;border:0;border-radius:14px;padding:14px 22px;font-weight:850;margin-top:23px;width:100%}textarea{background:#222a32;color:var(--text);border:1px solid #37414a;border-radius:13px;resize:vertical;width:100%;min-height:70px;padding:12px;margin-top:12px;line-height:1.5}textarea::placeholder{color:#71818a}

  <title>ПУЛЬС — маленький шаг каждый день</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#today" data-view="today" aria-label="ПУЛЬС, на главную"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M5 21h8l5-10 5 19 5-9h7"/></svg></span><span>ПУЛЬС<span class="brand-dot">.</span></span></a>
      <div class="today-label" id="headerDate"></div>
    </header>
    <main id="mainContent" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Разделы">
      <button class="nav-item active" data-view="today" aria-label="Сегодня"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span><span>Сегодня</span></button>
      <button class="nav-item" data-view="progress" aria-label="Прогресс"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="4" y="13" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="11" rx="1"/><rect x="16" y="4" width="4" height="16" rx="1"/></svg></span><span>Прогресс</span></button>
      <button class="nav-item" data-view="settings" aria-label="Настройки"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.65 5.65l1.42 1.42m9.86 9.86 1.42 1.42m0-12.7-1.42 1.42M7.07 16.93l-1.42 1.42"/><circle cx="12" cy="12" r="4"/></svg></span><span>Параметры</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="overlay" class="overlay" hidden></div>
  <script>
/* ПУЛЬС 1.0 — полностью локальное приложение, без аналитики и сетевых запросов. */
(() => {
  'use strict';
  const KEY = 'pulse_mini_v1';
  const main = document.getElementById('mainContent');
  const toastEl = document.getElementById('toast');
  const overlay = document.getElementById('overlay');
  const MOODS = [
    {emoji:'😞',name:'Тяжело'},
    {emoji:'😕',name:'Грустно'},
    {emoji:'😐',name:'Нормально'},
    {emoji:'🙂',name:'Хорошо'},
    {emoji:'😄',name:'Отлично'}
  ];
  const FATIGUE = ['Нет усталости','Небольшая','Средняя','Сильная','Очень сильная'];
  let view = ['today','progress','settings'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'today';
  let timer = null;
  let toastTimeout = 0;
  let state = loadState();

  function dateKey(date = new Date()) {
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  }
  function formatClock(seconds) {
    const s = Math.max(0, Math.ceil(seconds));
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }
  function dateFromKey(key) {
    const [y,m,d] = key.split('-').map(Number);
    return new Date(y,m-1,d,12);
  }
  function dayLabel(key) { return dateFromKey(key).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
  function esc(value) { return String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function defaults() {
    return {version:1, settings:{pushups:5,squats:8,plank:15},checkins:{},sessions:[],progress:{day:dateKey(),mode:'normal',manualRest:false,done:[],status:'open'}};
  }
  function bounded(n,min,max,fallback){const v=Number(n);return Number.isFinite(v)?Math.min(max,Math.max(min,Math.round(v))):fallback;}
  function loadState() {
    const def = defaults();
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (!saved || typeof saved !== 'object') return def;
      def.settings.pushups=bounded(saved.settings?.pushups,1,20,5);
      def.settings.squats=bounded(saved.settings?.squats,1,25,8);
      def.settings.plank=bounded(saved.settings?.plank,5,90,15);
      if (saved.checkins && typeof saved.checkins === 'object' && !Array.isArray(saved.checkins)) {
        for (const [key,v] of Object.entries(saved.checkins)) {
          if (/^\d{4}-\d{2}-\d{2}$/.test(key) && v && typeof v === 'object') {
            def.checkins[key]={mood:bounded(v.mood,1,5,3),fatigue:bounded(v.fatigue,0,4,1),note:String(v.note||'').slice(0,160)};
          }
        }
      }
      if (Array.isArray(saved.sessions)) {
        def.sessions=saved.sessions.filter(s=>s&&typeof s.day==='string'&&Array.isArray(s.completed)).slice(-500).map(s=>({
          id:String(s.id||'').slice(0,80),day:s.day,mode:['normal','light','rest'].includes(s.mode)?s.mode:'normal',
          completed:s.completed.filter(t=>t&&typeof t.id==='string').map(t=>({id:t.id,count:bounded(t.count,0,999,0),name:String(t.name||'').slice(0,80)})),
          possible:bounded(s.possible,0,10,3),endedAt:String(s.endedAt||''),mood:bounded(s.mood,1,5,3),fatigue:bounded(s.fatigue,0,4,1)
        }));
      }
      if (saved.progress?.day===dateKey()) {
        def.progress={day:dateKey(),mode:['normal','light','rest'].includes(saved.progress.mode)?saved.progress.mode:'normal',manualRest:!!saved.progress.manualRest,done:Array.isArray(saved.progress.done)?saved.progress.done.filter(x=>typeof x==='string').slice(0,10):[],status:saved.progress.status==='complete'?'complete':'open'};
      }
      return def;
    } catch(err){console.warn('Не удалось прочитать локальные данные',err);return def;}
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('Не получилось сохранить данные: проверь память браузера');}}
  function todayCheckin(){return state.checkins[dateKey()]||null;}
  function ensureToday(){
    if(state.progress.day!==dateKey()){
      stopTimer();state.progress={day:dateKey(),mode:'normal',manualRest:false,done:[],status:'open'};state.progress.mode=deriveMode();save();
    }
  }
  function deriveMode(){
    const c=todayCheckin();
    if(state.progress?.manualRest || (c && c.fatigue>=3))return 'rest';
    if(c && (c.fatigue>=2 || c.mood<=2))return 'light';
    return 'normal';
  }
  function currentMode(){return state.progress.mode;}
  function updateMode(){
    if(state.progress.status!=='complete' && state.progress.done.length===0){
      state.progress.mode=deriveMode();stopTimer();
    }
  }
  function planFor(mode){
    const s=state.settings;
    if(mode==='rest')return [
      {id:'breath',name:'Спокойное дыхание',count:30,unit:'сек',duration:30,icon:'🌿',color:'purple',desc:'Дыши спокойно, в удобном темпе.'},
      {id:'water',name:'Пауза и вода',count:1,unit:'раз',icon:'💧',color:'',desc:'Попей воды и немного отдохни.'},
      {id:'stretch',name:'Лёгкая разминка',count:20,unit:'сек',duration:20,icon:'🧘',color:'orange',desc:'Без боли и резких движений.'}
    ];
    if(mode==='light')return [
      {id:'pushups',name:'Отжимания',count:Math.max(1,Math.ceil(s.pushups*.6)),unit:'раз',icon:'💪',color:'',desc:'Можно от стены или с колен.'},
      {id:'squats',name:'Приседания',count:Math.max(2,Math.ceil(s.squats*.6)),unit:'раз',icon:'⚡',color:'purple',desc:'Не спеши, движения плавные.'},
      {id:'stretch',name:'Потянуться',count:20,unit:'сек',duration:20,icon:'🧘',color:'orange',desc:'Мягко разомни плечи и спину.'}
    ];
    return [
      {id:'pushups',name:'Отжимания',count:s.pushups,unit:'раз',icon:'💪',color:'',desc:'Можно от стены или с колен.'},
      {id:'squats',name:'Приседания',count:s.squats,unit:'раз',icon:'⚡',color:'purple',desc:'Спокойно, не на скорость.'},
      {id:'plank',name:'Планка',count:s.plank,unit:'сек',duration:s.plank,icon:'⏱',color:'orange',desc:'Держи удобное положение.'}
    ];
  }
  const modes={
    normal:{name:'Мини-победа',subtitle:'Небольшой комплекс на сегодня.',title:'Всего <em>5 минут?</em><br>Начни с малого.',desc:'Тебе не нужно быть идеальным. Один маленький шаг — уже успех.',label:'НЕБОЛЬШОЙ ШАГ — БОЛЬШАЯ ПОБЕДА'},
    light:{name:'Лёгкий старт',subtitle:'Снизили нагрузку под твоё состояние.',title:'Можно <em>помедленнее.</em><br>Это нормально.',desc:'Ты сам выбираешь темп. Сегодня достаточно небольшого движения.',label:'ТВОЙ ТЕМП — ТВОИ ПРАВИЛА'},
    rest:{name:'Бережный день',subtitle:'Сегодня восстановление важнее нагрузки.',title:'Отдых —<br><em>тоже прогресс.</em>',desc:'Не нужно делать упражнения через силу. Подыши, отдохни, попей воды.',label:'ОТДЫХАТЬ — ЭТО НОРМАЛЬНО'}
  };
  function toast(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toastEl.classList.remove('show'),2700);}
  function stopTimer(){if(timer?.tickId)clearInterval(timer.tickId);timer=null;}
  function startTimer(id){
    const item=planFor(currentMode()).find(x=>x.id===id && x.duration);
    if(!item || state.progress.done.includes(id))return;
    if(timer && timer.id!==id)stopTimer();
    if(!timer){timer={id,remaining:item.duration,running:false,tickId:null};}
    if(timer.running){timer.remaining=Math.max(1,Math.ceil((timer.deadline-Date.now())/1000));clearInterval(timer.tickId);timer.tickId=null;timer.running=false;render();return;}
    timer.running=true;timer.deadline=Date.now()+timer.remaining*1000;
    timer.tickId=setInterval(()=>{
      if(!timer || !timer.running)return;
      timer.remaining=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));
      const clock=document.getElementById('timerClock');
      if(clock)clock.textContent=formatClock(timer.remaining);
      if(timer.remaining<=0){const doneId=timer.id;stopTimer();finishTask(doneId);}
    },175);
    render();
  }
  function finishTask(id){
    if(state.progress.status==='complete')return;
    const all=planFor(currentMode());if(!all.some(t=>t.id===id))return;
    if(timer?.id===id)stopTimer();
    if(!state.progress.done.includes(id))state.progress.done.push(id);
    if(state.progress.done.length>=all.length){completeSession(false);return;}
    save();render();toast('Готово! Маленькая победа ✨');
  }
  function undoTask(id){if(state.progress.status==='complete')return;state.progress.done=state.progress.done.filter(x=>x!==id);save();render();}
  function completeSession(early){
    if(state.progress.status==='complete')return;
    stopTimer();
    const tasks=planFor(currentMode());
    const completed=tasks.filter(t=>state.progress.done.includes(t.id)).map(t=>({id:t.id,name:t.name,count:t.count}));
    const c=todayCheckin();
    const session={id:`${Date.now()}-${Math.random().toString(36).slice(2,6)}`,day:dateKey(),mode:currentMode(),completed,possible:tasks.length,endedAt:new Date().toISOString(),mood:c?.mood||3,fatigue:c?.fatigue||1};
    state.sessions.push(session);state.sessions=state.sessions.slice(-500);state.progress.status='complete';save();render();
    showModal(session,early);
  }
  function showModal(session,early){
    const rest=session.mode==='rest' || session.completed.length===0;
    overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><span class="celebrate" aria-hidden="true">${rest?'🌿':'🎉'}</span><h2 id="modalTitle">${rest?'Ты позаботился о себе':'Это победа!'}</h2><p>${rest?'Отдых и забота о себе важны. Сегодня достаточно.':early?'Ты сделал столько, сколько было комфортно. Это уже результат.':`Выполнено ${session.completed.length} маленьких задания. Всё начинается с первого шага!`}</p><button type="button" data-action="close-modal">Отлично!</button></div>`;
    overlay.hidden=false;overlay.querySelector('button').focus();
  }
  function renderHero(){
    const m=modes[currentMode()];const isCompleted=state.progress.status==='complete';
    const title=isCompleted?'Сегодня <em>ты молодец.</em>':currentMode()==='normal'?`Начни с <em>${state.settings.pushups} отжиманий.</em>`:m.title;
    const desc=isCompleted?'Ты уже уделил время себе. Можно спокойно отдыхать.':m.desc;
    return `<section class="hero"><div class="eyebrow">✳ ${m.label}</div><h1>${title}</h1><p>${desc}</p><div class="hero-pills"><span class="pill">${currentMode()==='rest'?'🌿 Бережный режим':currentMode()==='light'?'↘ Облегчённый':'✦ Мини-тренировка'}</span><span class="pill">⏱ <strong>${currentMode()==='normal'?'2–3':currentMode()==='light'?'1–2':'1–2'} мин</strong></span></div></section>`;
  }
  function renderCheckin(){
    const c=todayCheckin();const mood=c?.mood??null;const fatigue=c?.fatigue??1;
    const note=c?.note??'';
    const recommendation=(!c)?'Выбери настроение и усталость — я подстрою мини-план.':fatigue===4?'Очень сильная усталость — лучше отдыхать. Если это необычно или долго не проходит, расскажи взрослому.':fatigue>=3?'Сегодня можно выбрать восстановление вместо нагрузки.':mood<=2?'Необязательно быть в хорошем настроении, чтобы сделать что-то для себя.':'Сделай столько, сколько комфортно. Остановись, если появилась боль.';
    return `<section class="section" aria-labelledby="checkinTitle"><div class="section-heading"><div><h2 id="checkinTitle">Как ты сейчас?</h2><small>Без оценок и давления</small></div><span aria-hidden="true">✦</span></div><div class="card"><div class="checkin-label">Психологическое состояние / настроение</div><div class="mood-row" role="group" aria-label="Выбери настроение">${MOODS.map((m,i)=>`<button type="button" class="mood ${mood===i+1?'selected':''}" data-mood="${i+1}" aria-pressed="${mood===i+1}"><span class="face" aria-hidden="true">${m.emoji}</span><small>${m.name}</small></button>`).join('')}</div><div class="inner-divider"></div><div class="range-head"><label for="fatigueRange">Усталость</label><span class="range-tag ${fatigue>=3?'warning':''}" id="fatigueText">${FATIGUE[fatigue]}</span></div><input type="range" id="fatigueRange" min="0" max="4" step="1" value="${fatigue}" aria-label="Уровень усталости" style="--range:${fatigue*25}%"><div class="range-ends"><span>Полон сил</span><span>Совсем устал</span></div><div class="recommendation ${fatigue>=3?'warn':''}"><span class="spark" aria-hidden="true">${fatigue>=3?'🧡':'✺'}</span><div><strong>${fatigue>=3?'Можно остановиться.':'Прислушивайся к себе.'}</strong><br>${recommendation}</div></div><label class="helper" for="checkinNote" style="display:block;margin-top:17px">Заметка для себя (необязательно)</label><textarea id="checkinNote" maxlength="160" placeholder="Например: устал после школы, но хочу размяться">${esc(note)}</textarea></div></section>`;
  }
  function renderExercises(){
    if(state.progress.status==='complete'){
      const todaySessions=state.sessions.filter(s=>s.day===dateKey());
      const last=todaySessions[todaySessions.length-1];
      return `<section class="section" aria-labelledby="finishedTitle"><div class="card finished"><div class="finished-icon" aria-hidden="true">✓</div><h2 id="finishedTitle">На сегодня достаточно 💚</h2><p>${last?.completed.length?`Сделано ${last.completed.length} из ${last.possible} заданий. `:''}Ты можешь гордиться тем, что позаботился о себе.</p>${todayCheckin()?.fatigue<3?'<button class="small-cta" data-action="restart" type="button">Начать ещё один мини-подход</button>':''}</div></section>`;
    }
    const p=state.progress;const tasks=planFor(currentMode());const amount=p.done.length;
    return `<section class="section" aria-labelledby="planTitle"><div class="section-heading"><div><h2 id="planTitle">Твой мини-план</h2><small>${modes[currentMode()].subtitle}</small></div>${todayCheckin()?.fatigue>=3?'<span class="muted" style="font-size:12px">Бережный режим</span>':`<button type="button" class="text-button" data-action="toggle-rest">${p.manualRest?'Вернуть план':'Хочу отдых'}</button>`}</div><div class="card"><div class="progress-top"><span class="progress-count">Выполнено</span><span class="progress-count">${amount} / ${tasks.length}</span></div><div class="bar" role="progressbar" aria-label="Выполнено упражнений" aria-valuenow="${amount}" aria-valuemin="0" aria-valuemax="${tasks.length}"><span style="width:${amount/tasks.length*100}%"></span></div><div class="exercises">${tasks.map(item=>{
      const done=p.done.includes(item.id);
      return `<div class="exercise ${done?'done':''}"><div class="exercise-icon ${item.color}" aria-hidden="true">${item.icon}</div><div class="exercise-text"><div class="exercise-name">${esc(item.name)}</div><div class="exercise-desc">${esc(item.desc)}</div><div class="exercise-amount">${item.count} ${item.unit}</div></div><button type="button" data-${done?'undo':'task'}="${item.id}" class="done-button ${done?'done-btn':''}" aria-label="${done?'Отменить выполнение':'Отметить выполнение'}: ${esc(item.name)}">${done?'✓ Готово':item.duration?'Таймер':'Сделал'}</button></div>${timer?.id===item.id && !done ? `<div class="timer-panel"><div><strong id="timerClock">${formatClock(timer.remaining)}</strong><br><span>Спокойный темп</span></div><button type="button" class="btn-timer" data-timer="${item.id}">${timer.running?'Пауза':'Продолжить'}</button></div>`:''}`;
    }).join('')}</div><button type="button" class="rest-toggle" data-action="finish-early">${amount?'Закончить на сегодня':'Пропустить без чувства вины'} →</button><div class="plan-footer"><small>Если больно или совсем нет сил — остановись. Не нужно терпеть.</small><span aria-hidden="true">💚</span></div></div></section>`;
  }
  function renderToday(){return renderHero()+renderCheckin()+renderExercises()+`<div class="tipline"><b>✳</b> Данные хранятся только на этом устройстве.</div>`;}
  function weekDays(){const arr=[];const now=new Date();for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i,12);arr.push({key:dateKey(d),name:d.toLocaleDateString('ru-RU',{weekday:'short'}),today:i===0});}return arr;}
  function renderProgress(){
    const sessions=state.sessions;const activeDays=new Set(sessions.map(s=>s.day)).size;
    const pushups=sessions.reduce((n,s)=>n+s.completed.filter(t=>t.id==='pushups').reduce((z,t)=>z+(t.count||0),0),0);
    const days=weekDays();const counts=days.map(d=>sessions.filter(s=>s.day===d.key).length);
    const max=Math.max(1,...counts);
    const hist=sessions.slice(-8).reverse();
    return `<div class="page-head"><div class="eyebrow">ТВОЯ ИСТОРИЯ</div><h1 style="margin-top:12px">Каждый шаг<br><span style="color:var(--lime)">имеет значение.</span></h1><p>Без рекордов и соревнований — просто твой собственный путь.</p></div><div class="stats-grid"><div class="stat-card"><strong>${sessions.length}</strong><span>мини-сессий</span></div><div class="stat-card"><strong>${activeDays}</strong><span>дней заботы о себе</span></div><div class="stat-card"><strong>${pushups}</strong><span>отжиманий</span></div></div><section class="section"><div class="section-heading"><div><h2>Последние 7 дней</h2><small>Занимался или выбирал отдых — всё считается</small></div></div><div class="card"><div class="week-grid">${days.map((d,i)=>`<div class="week-day ${d.today?'today':''}"><div class="week-column"><span class="${counts[i]?'active':''}" style="--height:${counts[i]?Math.round(counts[i]/max*100):7}%" title="${counts[i]} сессий"></span></div><span>${esc(d.name)}</span><span>${counts[i]?'●':'·'}</span></div>`).join('')}</div></div></section><section class="section"><div class="section-heading"><div><h2>Дневник</h2><small>Твои последние сессии</small></div></div><div class="history">${hist.length?hist.map(s=>`<div class="history-item"><div><strong>${dayLabel(s.day)} · ${s.mode==='rest'?'Восстановление':s.mode==='light'?'Лёгкий старт':'Мини-тренировка'}</strong><small>${s.completed.length} из ${s.possible} заданий · настроение ${MOODS[(s.mood||3)-1]?.emoji||'😐'}</small></div><span class="history-tag">${s.completed.length===0?'Отдых ✓':`${s.completed.length} ✓`}</span></div>`).join(''):`<div class="card empty">Тут появятся твои первые маленькие победы. Начать можно с одного упражнения 💚</div>`}</div></section><div class="insight-card"><div class="eyebrow">НАПОМИНАНИЕ</div><h2>Прогресс не обязан быть ровным.</h2><p>Если вчера ты отдыхал, а сегодня сделал пару повторений — ты уже заботишься о себе.</p></div>`;
  }
  function settingSlider(name,label,min,max,unit){const val=state.settings[name];return `<div class="setting-row"><div class="setting-row-head"><label for="setting-${name}"><strong>${label}</strong></label><span id="value-${name}">${val} ${unit}</span></div><input type="range" data-setting="${name}" id="setting-${name}" min="${min}" max="${max}" value="${val}" style="--range:${(val-min)/(max-min)*100}%"><div class="range-ends"><span>${min}</span><span>${max}</span></div></div>`;}
  function renderSettings(){
    return `<div class="page-head"><div class="eyebrow">НАСТРОЙКИ</div><h1 style="margin-top:12px">Всё <span style="color:var(--lime)">под тебя.</span></h1><p>Любую цель можно уменьшить. Лучше немного, чем через силу.</p></div><section class="section" style="margin-top:6px"><div class="section-heading"><div><h2>Мой обычный план</h2><small>Для хорошего самочувствия</small></div></div><div class="card">${settingSlider('pushups','Отжимания',1,20,'раз')}${settingSlider('squats','Приседания',1,25,'раз')}${settingSlider('plank','Планка',5,90,'сек')}<div class="recommendation"><span class="spark">✺</span><div><strong>Если усталость высокая,</strong><br>ПУЛЬС автоматически предлагает отдых вместо нагрузки.</div></div></div></section><section class="section"><div class="section-heading"><div><h2>Мои данные</h2><small>Личная информация остаётся локально</small></div></div><div class="card"><h3>Без аккаунта и интернета</h3><p class="helper">Настроение, усталость и история занятий сохраняются только в памяти приложения на этом устройстве. Удаление данных приложения или очистка браузера может стереть историю.</p><button type="button" class="action-btn" data-action="export">↗ Сохранить мою историю (JSON)</button><button type="button" class="action-btn danger" data-action="reset">× Очистить все данные</button></div></section><p class="credits">ПУЛЬС v1.0 · Маленькие действия каждый день<br>Это не медицинская диагностика или программа лечения.</p>`;
  }
  function render(){
    ensureToday();
    document.getElementById('headerDate').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
    main.innerHTML=view==='progress'?renderProgress():view==='settings'?renderSettings():renderToday();
    document.querySelectorAll('[data-view]').forEach(el=>{
      const active=el.dataset.view===view;el.classList.toggle('active',active);if(el.tagName==='BUTTON')el.setAttribute('aria-current',active?'page':'false');
    });
  }
  function checkinPatch(patch){
    const key=dateKey();const prev=todayCheckin()||{mood:3,fatigue:1,note:''};
    state.checkins[key]={...prev,...patch};
    updateMode();save();render();
  }
  function setRest(){
    if(state.progress.status==='complete')return;
    state.progress.manualRest=!state.progress.manualRest;
    if(state.progress.done.length>0){
      // Изменение режима сохраняет уже выполненные задания в текущей сессии.
      toast('Сначала закончи текущий мини-план, чтобы сменить режим');
      state.progress.manualRest=!state.progress.manualRest;return;
    }
    updateMode();save();render();
  }
  function exportData(){
    const payload=JSON.stringify({exportedAt:new Date().toISOString(),app:'ПУЛЬС 1.0',data:state},null,2);
    if(window.NativeBridge && typeof window.NativeBridge.shareData==='function'){
      window.NativeBridge.shareData(payload);toast('Выбери приложение, чтобы сохранить данные');return;
    }
    const blob=new Blob([payload],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`pulse-history-${dateKey()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);
    toast('История экспортирована');
  }
  function resetData(){
    if(!confirm('Точно удалить всю историю, настроение и настройки? Отменить это действие нельзя.'))return;
    stopTimer();state=defaults();save();view='today';location.hash='today';render();toast('Все данные очищены');
  }
  document.addEventListener('click',e=>{
    const navigation=e.target.closest('[data-view]');
    if(navigation){e.preventDefault();view=navigation.dataset.view;location.hash=view;stopTimer();render();scrollTo({top:0,behavior:'smooth'});return;}
    const mood=e.target.closest('[data-mood]');if(mood){checkinPatch({mood:Number(mood.dataset.mood)});return;}
    const task=e.target.closest('[data-task]');if(task){const t=planFor(currentMode()).find(t=>t.id===task.dataset.task);if(t?.duration){startTimer(t.id);}else{finishTask(t?.id);}return;}
    const undo=e.target.closest('[data-undo]');if(undo){undoTask(undo.dataset.undo);return;}
    const timerButton=e.target.closest('[data-timer]');if(timerButton){startTimer(timerButton.dataset.timer);return;}
    const action=e.target.closest('[data-action]')?.dataset.action;
    switch(action){
      case 'toggle-rest':setRest();break;
      case 'finish-early':completeSession(true);break;
      case 'restart':state.progress={day:dateKey(),mode:deriveMode(),manualRest:false,done:[],status:'open'};save();render();break;
      case 'export':exportData();break;
      case 'reset':resetData();break;
      case 'close-modal':overlay.hidden=true;overlay.innerHTML='';break;
    }
  });
  document.addEventListener('input',e=>{
    const el=e.target;
    if(el.id==='fatigueRange'){
      const val=bounded(el.value,0,4,1);document.getElementById('fatigueText').textContent=FATIGUE[val];
      document.getElementById('fatigueText').classList.toggle('warning',val>=3);
      el.style.setProperty('--range',`${val*25}%`);
    }
    if(el.dataset.setting){
      const name=el.dataset.setting;state.settings[name]=Number(el.value);
      document.getElementById(`value-${name}`).textContent=`${el.value} ${name==='plank'?'сек':'раз'}`;
      el.style.setProperty('--range',`${(Number(el.value)-Number(el.min))/(Number(el.max)-Number(el.min))*100}%`);save();
    }
    if(el.id==='checkinNote'){
      const key=dateKey();state.checkins[key]={...(todayCheckin()||{mood:3,fatigue:1}),note:el.value.slice(0,160)};save();
    }
  });
  document.addEventListener('change',e=>{
    const el=e.target;
    if(el.id==='fatigueRange')checkinPatch({fatigue:bounded(el.value,0,4,1)});
    if(el.dataset.setting){updateMode();save();render();}
  });
  window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['today','progress','settings'].includes(v)&&v!==view){view=v;stopTimer();render();}});
  window.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){
      if(state.progress.day!==dateKey())render();
      if(timer?.running && timer.deadline<=Date.now()){const id=timer.id;stopTimer();finishTask(id);}
    }
  });
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  render();
})();

  </script>
</body>
