<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#0b0e13">
  <meta name="description" content="ПУЛЬС — мини-тренировки с выбором уровня, зон мышц, визуальной схемой тела и бережной мотивацией.">
  <style>

.hero{position:relative;overflow:hidden;border-radius:29px;padding:28px 24px 27px;background:linear-gradient(134deg,#222f30 0%,#1d282b 51%,#142022 100%);border:1px solid #394a48;box-shadow:var(--shadow)}.hero::before{content:"";position:absolute;width:240px;height:240px;right:-112px;top:-90px;border-radius:100%;border:45px solid #d0ff8325;box-shadow:0 0 0 35px #d0ff8311,0 0 0 80px #d0ff8307;pointer-events:none}.hero .eyebrow{margin-bottom:16px;position:relative}.hero h1{max-width:380px;position:relative}.hero h1 em{color:var(--lime);font-style:normal}.hero p{position:relative;margin-top:16px;max-width:380px;line-height:1.55;color:#bdcdc5;font-size:14px}.hero-pills{position:relative;display:flex;gap:7px;flex-wrap:wrap;margin-top:25px}.pill{background:#f4fff015;border:1px solid #eaffd92b;padding:9px 11px;border-radius:100px;font-size:12px;color:#e3eadd;font-weight:730}.pill strong{color:var(--lime)}
.section{margin-top:29px}.section-heading{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:15px}.section-heading small{color:var(--muted);font-size:12px;line-height:1.45}.section-heading h2{margin-bottom:4px}.card{background:var(--card);border:1px solid #303641;border-radius:var(--radius);padding:20px;box-shadow:0 8px 34px #0002}
.checkin-label{color:var(--muted);font-size:13px;margin-bottom:14px}.mood-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.mood{border:1px solid transparent;background:#242b33;min-height:67px;border-radius:16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .2s,border-color .2s,background .2s}.mood:hover{transform:translateY(-2px)}.mood.selected{background:#32432f;border-color:var(--lime);color:var(--lime)}.mood .face{font-size:25px;line-height:1.1}.mood small{font-size:10px;font-weight:700}.inner-divider{height:1px;background:var(--line);margin:20px 0}.range-head{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700}.range-tag{padding:6px 10px;background:#2b3038;border-radius:100px;font-size:11px;color:#e4edf0}.range-tag.warning{background:#46332e;color:#ffcead}

.recommendation{display:flex;gap:11px;align-items:flex-start;margin-top:15px;border-radius:17px;background:#232a28;border:1px solid #374639;padding:14px;color:#becdc0;font-size:13px;line-height:1.5}.recommendation .spark{font-size:19px}.recommendation strong{color:#e2f4dc}.recommendation.warn{background:#302724;border-color:#51403a;color:#e7c4b6}.recommendation.warn strong{color:#ffe0d1}

.setup-grid{display:grid;gap:18px}.setup-block{background:#1a2129;border:1px solid #2f3742;border-radius:20px;padding:16px}.setup-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.setup-head strong{font-size:15px}.chip-row{display:flex;flex-wrap:wrap;gap:8px}.choice-chip,.focus-chip{border:1px solid #36414b;background:#20272f;color:#dbe3e7;border-radius:15px;padding:11px 13px;min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .18s,border-color .18s,background .18s}.choice-chip:hover,.focus-chip:hover{transform:translateY(-1px)}.choice-chip.active,.focus-chip.active{background:#31402f;border-color:var(--lime);color:var(--lime)}.choice-chip small{display:block;font-size:11px;color:inherit;opacity:.85}.choice-chip span{display:block;font-size:13px;font-weight:780}.choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.focus-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.focus-chip{justify-content:flex-start;align-items:flex-start;flex-direction:column;gap:4px;text-align:left;min-height:68px}.focus-chip strong{font-size:13px}.focus-chip small{font-size:11px;color:inherit;opacity:.86;line-height:1.35}

.timer-panel{margin-top:11px;border:1px solid #47524b;border-radius:17px;padding:15px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#202b26}.timer-panel strong{font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:1px}.timer-panel span{font-size:12px;color:var(--muted)}.btn-timer{border:0;border-radius:12px;background:var(--lime);color:#172315;font-weight:790;padding:11px 16px}.btn-soft{border:1px solid #37414a;background:#252e35;color:var(--text);border-radius:13px;font-size:12px;padding:11px 14px;font-weight:750}
.plan-footer{padding-top:18px;display:flex;gap:12px;align-items:center;justify-content:space-between}.plan-footer small{color:var(--muted);line-height:1.4;max-width:230px}.rest-toggle{border:1px dashed #596753;background:#253029;color:#daf1cc;border-radius:16px;padding:13px 15px;width:100%;font-size:13px;font-weight:750;margin-top:14px}.finished{text-align:center;padding:31px 16px}.finished-icon{display:grid;place-items:center;background:#2d412e;border-radius:23px;width:72px;height:72px;margin:0 auto 20px;color:var(--lime);font-size:35px}.finished h2{font-size:27px;margin-bottom:10px}.finished p{line-height:1.55;font-size:14px;color:var(--muted)}.small-cta{margin-top:22px;border:0;border-radius:14px;background:var(--lime);color:#192016;padding:13px 16px;font-weight:850}
.guide-list{display:grid;gap:10px}.guide-card{border:1px solid #313944;background:#1a2129;border-radius:19px;padding:15px}.guide-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.guide-top strong{font-size:15px}.guide-badge{font-size:11px;padding:6px 9px;border-radius:999px;background:#253038;border:1px solid #35444d;color:#dae2e6}.guide-card p{font-size:13px;line-height:1.5;color:#cdd5d9}.guide-card p + p{margin-top:8px}.guide-card b{color:#eef5ef}
.tipline{margin:27px 0 12px;display:flex;align-items:center;gap:10px;color:#889595;font-size:12px;line-height:1.4}.tipline b{font-size:17px;color:var(--lime)}.insight-card{background:linear-gradient(120deg,#2c2938,#1b2229);border:1px solid #413e55;border-radius:22px;padding:23px;margin-top:20px}.insight-card h2{font-size:22px;margin-top:8px}.insight-card p{color:#b8b8c9;font-size:13px;line-height:1.55;margin-top:12px}
.page-head{padding:17px 2px 22px}.page-head p{color:var(--muted);font-size:13px;margin-top:10px;line-height:1.5}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat-card{border:1px solid #343a43;background:var(--card);border-radius:19px;padding:16px 11px}.stat-card strong{display:block;font-size:clamp(24px,6vw,31px);color:var(--lime);letter-spacing:-1.3px}.stat-card span{font-size:11px;color:var(--muted);line-height:1.4;display:block;margin-top:7px}.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;margin-top:19px}.week-day{display:grid;gap:7px;text-align:center;justify-items:center;color:var(--muted);font-size:11px}.week-column{height:90px;width:100%;display:flex;align-items:end;justify-content:center}.week-column span{display:block;width:100%;max-width:35px;height:var(--height,10%);min-height:6px;background:#384047;border-radius:9px 9px 4px 4px}.week-column span.active{background:linear-gradient(180deg,var(--lime),#7ba746)}.week-day.today{color:var(--lime)}.history{display:grid;gap:9px;margin-top:15px}.history-item{background:#171d25;border:1px solid #2e3640;border-radius:18px;padding:15px 16px;display:flex;gap:12px;justify-content:space-between;align-items:center}.history-item strong{display:block;font-size:14px}.history-item small{color:var(--muted);display:block;font-size:12px;line-height:1.45;margin-top:4px}.history-tag{font-size:11px;padding:8px 10px;border-radius:100px;background:#253028;color:#d7eccc;border:1px solid #425347;white-space:nowrap}.empty{font-size:14px;line-height:1.6;color:var(--muted)}
.action-btn{width:100%;margin-top:11px;border:1px solid #33404b;background:#202831;color:var(--text);border-radius:14px;padding:13px 14px;font-weight:760;text-align:left}.action-btn.danger{border-color:#4c3939;background:#2b2121;color:#ffd1d1}.credits{margin:28px 3px 0;color:#78858b;font-size:12px;line-height:1.55;text-align:center}
.bottom-nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(530px,calc(100vw - 22px));background:#10151ddb;border:1px solid #26313d;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 24px 70px #0006;border-radius:24px;padding:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;z-index:30}.nav-btn{border:0;background:transparent;color:#90a0a7;border-radius:18px;padding:10px 10px 9px;display:grid;justify-items:center;gap:5px;font-size:11px;font-weight:720}.nav-btn .icon{font-size:18px}.nav-btn.active{background:#243028;color:var(--lime)}
.overlay{position:fixed;inset:0;background:#05070bcf;display:grid;place-items:center;padding:22px;z-index:60}.modal{max-width:410px;width:100%;background:#151b23;border:1px solid #33404b;border-radius:28px;padding:28px 24px 24px;box-shadow:var(--shadow);text-align:center}.modal .celebrate{font-size:45px;display:block;margin-bottom:14px}.modal p{margin-top:11px;color:#cbd3d7;line-height:1.6;font-size:14px}.modal button{margin-top:20px;border:0;border-radius:14px;padding:13px 16px;background:var(--lime);color:#172315;font-weight:850;min-width:130px}
.toast{position:fixed;left:50%;bottom:103px;transform:translateX(-50%) translateY(18px);background:#101821;border:1px solid #30404a;color:#eef4f2;padding:12px 15px;border-radius:14px;box-shadow:0 14px 44px #0005;opacity:0;pointer-events:none;transition:.22s;max-width:min(90vw,420px);font-size:13px;z-index:70}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:520px){.body-card{grid-template-columns:1fr}.body-wrap{order:-1}.focus-grid{grid-template-columns:1fr 1fr}.exercise{grid-template-columns:48px minmax(0,1fr)}.done-button{grid-column:1/-1;width:100%}.stats-grid{grid-template-columns:1fr 1fr 1fr}.choice-grid{grid-template-columns:1fr}.section-heading{align-items:flex-start}}
  
.autocount-row{padding:10px 13px;border-radius:15px;border:1px solid #334d3e;background:#1d2c23;display:flex;align-items:center;justify-content:space-between;gap:12px}
.autocount-row p{font-size:12px;line-height:1.45;color:#c6daca;flex:1}.autocount-start{border:1px solid #b6e380;background:#aee56e;color:#142214;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800;white-space:nowrap}
.counter-hint{margin-top:13px;color:#c3d4c3;font-size:12px;line-height:1.5;padding:13px 14px;border:1px solid #35513b;background:#1e2923;border-radius:15px}

<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="#today" class="brand" aria-label="ПУЛЬС — на главную">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M2 12h5l2.7-4.6L14.2 18 17 12h5"/></svg>
        </span>
        ПУЛЬС<span class="brand-dot">.</span>
      </a>
      <div class="today-label">Сегодня · <span id="headerDate"></span></div>
    </header>

    <main id="app"></main>
  </div>

  <nav class="bottom-nav" aria-label="Основная навигация">
    <button class="nav-btn" data-view="today" aria-current="page"><span class="icon">🏠</span><span>Сегодня</span></button>
    <button class="nav-btn" data-view="progress"><span class="icon">📈</span><span>Прогресс</span></button>
    <button class="nav-btn" data-view="settings"><span class="icon">⚙️</span><span>Настройки</span></button>
  </nav>

  <div class="overlay" id="overlay" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
  const KEY='pulse-mini-workout';
  const main=document.getElementById('app');
  const overlay=document.getElementById('overlay');
  const toastEl=document.getElementById('toast');
  const MOODS=[
    {emoji:'😣',name:'Тяжело'},
    {emoji:'😕',name:'Не очень'},
    {emoji:'😐',name:'Норм'},
    {emoji:'🙂',name:'Хорошо'},
    {emoji:'😄',name:'Отлично'}
  ];
  const FATIGUE=['Полон сил','Лёгкая','Средняя','Сильная','Предел'];
  const LEVELS={
    beginner:{name:'Новичок',short:'Низкая нагрузка',factor:1},
    regular:{name:'База',short:'Умеренно',factor:1.35},
    strong:{name:'Заряжен',short:'Побольше',factor:1.75}
  };
  const FOCUSES={
    full:{name:'Всё тело',sub:'разминка + базовый тонус',summary:'Мягко включаем всё тело: грудь, корпус, ноги и руки.',labels:['грудь','пресс','ноги','руки']},
    arms:{name:'Руки / бицепс',sub:'руки и верх',summary:'Сегодня акцент на руки: бицепс, трицепс и плечевой пояс.',labels:['бицепс','трицепс','плечи']},
    chest:{name:'Грудь',sub:'грудные + перед плеч',summary:'Нагрузка на грудные мышцы и немного на переднюю часть плеч.',labels:['грудь','перед плеч']},
    abs:{name:'Пресс',sub:'корпус и живот',summary:'Работаем на пресс, кор и стабильность корпуса.',labels:['верх пресса','низ пресса','кор']},
    legs:{name:'Ноги',sub:'бёдра и ягодицы',summary:'Фокус на ноги: передняя поверхность бедра, ягодицы и икры.',labels:['квадрицепс','ягодицы','икры']},
    back:{name:'Спина',sub:'осанка и задняя цепь',summary:'Включаем спину, поясницу и мышцы для хорошей осанки.',labels:['верх спины','поясница','лопатки']}
  };
  let toastTimeout=null;
  let timer=null;
  let view=['today','progress','settings'].includes(location.hash.slice(1))?location.hash.slice(1):'today';

  function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m]));}
  function dateKey(d=new Date()){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).toISOString().slice(0,10);}
  function dayLabel(key){const d=new Date(key+'T12:00:00');return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});}
  function formatClock(sec){const m=Math.floor(sec/60);const s=Math.max(0,sec%60);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
  function bounded(n,min,max,fallback){const v=Number(n);return Number.isFinite(v)?Math.min(max,Math.max(min,Math.round(v))):fallback;}

  function defaults(){
    return {
      version:3,
      settings:{level:'beginner',focus:'full'},
      checkins:{},
      sessions:[],
      progress:{day:dateKey(),mode:'normal',manualRest:false,done:[],partial:{},status:'open'}
    };
  }

  function loadState(){
    const def=defaults();
    try{
      const saved=JSON.parse(localStorage.getItem(KEY));
      if(!saved || typeof saved!=='object') return def;
      const oldSettings=saved.settings||{};
      def.settings.level=LEVELS[oldSettings.level]?oldSettings.level:'beginner';
      def.settings.focus=FOCUSES[oldSettings.focus]?oldSettings.focus:'full';
      if(saved.checkins && typeof saved.checkins==='object' && !Array.isArray(saved.checkins)){
        for(const [key,v] of Object.entries(saved.checkins)){
          if(/^\d{4}-\d{2}-\d{2}$/.test(key) && v && typeof v==='object'){
            def.checkins[key]={mood:bounded(v.mood,1,5,3),fatigue:bounded(v.fatigue,0,4,1),note:String(v.note||'').slice(0,160)};
          }
        }
      }
      if(Array.isArray(saved.sessions)){
        def.sessions=saved.sessions.filter(s=>s&&typeof s.day==='string'&&Array.isArray(s.completed)).slice(-500).map(s=>({
          id:String(s.id||'').slice(0,90),
          day:s.day,
          mode:['normal','light','rest'].includes(s.mode)?s.mode:'normal',
          focus:FOCUSES[s.focus]?s.focus:'full',
          level:LEVELS[s.level]?s.level:'beginner',
          completed:s.completed.filter(t=>t&&typeof t.id==='string').map(t=>({id:t.id,count:bounded(t.count,0,999,0),name:String(t.name||'').slice(0,80)})),
          possible:bounded(s.possible,0,20,3),
          endedAt:String(s.endedAt||''),
          mood:bounded(s.mood,1,5,3),
          fatigue:bounded(s.fatigue,0,4,1)
        }));
      }
      if(saved.progress?.day===dateKey()){
        def.progress={
          day:dateKey(),
          mode:['normal','light','rest'].includes(saved.progress.mode)?saved.progress.mode:'normal',
          manualRest:!!saved.progress.manualRest,
          done:Array.isArray(saved.progress.done)?saved.progress.done.filter(x=>typeof x==='string').slice(0,20):[],
          partial:saved.progress.partial&&typeof saved.progress.partial==='object'?Object.fromEntries(Object.entries(saved.progress.partial).filter(([k,v])=>/^[a-z-]{3,25}$/.test(k)&&Number.isFinite(Number(v))).map(([k,v])=>[k,bounded(v,0,100,0)])): {},
          status:saved.progress.status==='complete'?'complete':'open'
        };
      }
      return def;
    }catch(err){console.warn('Не удалось прочитать локальные данные',err);return def;}
  }

  let state=loadState();
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('Не получилось сохранить данные: проверь память устройства');}}
  function todayCheckin(){return state.checkins[dateKey()]||null;}
  function ensureToday(){if(state.progress.day!==dateKey()){stopTimer();state.progress={day:dateKey(),mode:'normal',manualRest:false,done:[],partial:{},status:'open'};state.progress.mode=deriveMode();save();}}
  function deriveMode(){const c=todayCheckin();if(state.progress?.manualRest || (c && c.fatigue>=3))return 'rest';if(c && (c.fatigue>=2 || c.mood<=2))return 'light';return 'normal';}
  function currentMode(){return state.progress.mode;}
  function updateMode(){if(state.progress.status!=='complete' && state.progress.done.length===0){state.progress.mode=deriveMode();stopTimer();}}
  function toast(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toastEl.classList.remove('show'),2800);}

  function scaleCount(base, mode, isDuration=false){
    const factor=(LEVELS[state.settings.level]||LEVELS.beginner).factor;
    const modeFactor=mode==='light'?0.68:1;
    const raw=base*factor*modeFactor;
    const n=isDuration?Math.round(raw/5)*5:Math.round(raw);
    return Math.max(isDuration?10:2,n);
  }

  }

      return `<section class="section" aria-labelledby="finishedTitle"><div class="card finished"><div class="finished-icon" aria-hidden="true">✓</div><h2 id="finishedTitle">На сегодня достаточно 💚</h2><p>${last?.completed.length?`Сделано ${last.completed.length} из ${last.possible} заданий. `:''}Ты уделил время ${FOCUSES[last?.focus||state.settings.focus].name.toLowerCase()} и позаботился о себе.</p>${todayCheckin()?.fatigue<3?'<button class="small-cta" data-action="restart" type="button">Начать ещё один мини-подход</button>':''}</div></section>`;

    const p=state.progress;const tasks=planFor(currentMode());const amount=p.done.length;
    const cameraAvailable=typeof window.NativeBridge?.startCounter==='function';
    return `<section class="section" aria-labelledby="planTitle"><div class="section-heading"><div><h2 id="planTitle">Твой план на сейчас</h2><small>${modes[currentMode()].subtitle}</small></div>${todayCheckin()?.fatigue>=3?'<span class="muted" style="font-size:12px">Бережный режим</span>':`<button type="button" class="btn-soft" data-action="toggle-rest">${p.manualRest?'Вернуть упражнения':'Хочу отдых'}</button>`}</div><div class="card">${cameraAvailable?`<div class="counter-hint">📷 <b>Автосчётчик упражнений (бета).</b> Считает приседания, отжимания и сгибания на бицепс по положению суставов. Видео не записывается и не отправляется на сервер. Дай разрешение камере при первом запуске.</div>`:''}<div class="progress-top"><span class="progress-count">Выполнено</span><span class="progress-count">${amount} / ${tasks.length}</span></div><div class="bar" role="progressbar" aria-label="Выполнено упражнений" aria-valuenow="${amount}" aria-valuemin="0" aria-valuemax="${tasks.length}"><span style="width:${amount/tasks.length*100}%"></span></div><div class="exercises">${tasks.map(item=>{const done=p.done.includes(item.id);return `<div class="exercise ${done?'done':''}"><div class="exercise-icon ${item.color}" aria-hidden="true">${item.icon}</div><div class="exercise-text"><div class="exercise-name">${esc(item.name)}</div><div class="exercise-desc">${esc(item.desc)}</div><div class="exercise-muscle"><span>${esc(item.muscles)}</span></div><div class="exercise-amount">${item.count} ${item.unit}</div></div><button type="button" data-${done?'undo':'task'}="${item.id}" class="done-button ${done?'done-btn':''}" aria-label="${done?'Отменить выполнение':'Отметить выполнение'}: ${esc(item.name)}">${done?'✓ Готово':item.duration?'Таймер':'Сделал'}</button></div>${cameraAvailable && !done && ['pushups','close-pushups','wide-pushups','wall-pushups','squats','biceps-curl'].includes(item.id)?`<div class="autocount-row"><p>📷 <strong>Счёт по камере</strong>${p.partial?.[item.id]?` · ${p.partial[item.id]} / ${item.count} уже распознано`:''}<br>Поставь телефон устойчиво и покажи тело в кадре.</p><button type="button" class="autocount-start" data-autocount="${item.id}">${p.partial?.[item.id]?'▶ Продолжить':'📷 Считать'}</button></div>`:''}${timer?.id===item.id && !done ? `<div class="timer-panel"><div><strong id="timerClock">${formatClock(timer.remaining)}</strong><br><span>Спокойный темп</span></div><button type="button" class="btn-timer" data-timer="${item.id}">${timer.running?'Пауза':'Продолжить'}</button></div>`:''}`;}).join('')}</div><button type="button" class="rest-toggle" data-action="finish-early">${amount?'Закончить на сегодня':'Пропустить без чувства вины'} →</button><div class="plan-footer"><small>Фокус: ${FOCUSES[state.settings.focus].name}. Уровень: ${LEVELS[state.settings.level].name}.</small><span aria-hidden="true">💚</span></div></div></section>`;
  }

  function renderGuides(){
    const tasks=planFor(currentMode());
    return `<section class="section" aria-labelledby="guideTitle"><div class="section-heading"><div><h2 id="guideTitle">Что качаем и как</h2><small>Коротко и понятно по каждому упражнению</small></div><span aria-hidden="true">🧠</span></div><div class="guide-list">${tasks.map((item,idx)=>`<div class="guide-card"><div class="guide-top"><strong>${idx+1}. ${esc(item.name)}</strong><span class="guide-badge">${esc(item.muscles)}</span></div><p><b>Как делать:</b> ${esc(item.how)}</p><p><b>Подсказка:</b> ${esc(item.tip)}</p></div>`).join('')}</div></section>`;
  }

  function renderToday(){return renderHero()+renderCheckin()+renderSetup()+renderExercises()+renderGuides()+`<div class="tipline"><b>✳</b> Данные хранятся только на этом устройстве.</div>`;}

  function weekDays(){const arr=[];const now=new Date();for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i,12);arr.push({key:dateKey(d),name:d.toLocaleDateString('ru-RU',{weekday:'short'}),today:i===0});}return arr;}

  function renderProgress(){
    const sessions=state.sessions;const activeDays=new Set(sessions.map(s=>s.day)).size;const doneTasks=sessions.reduce((n,s)=>n+s.completed.length,0);
    const days=weekDays();const counts=days.map(d=>sessions.filter(s=>s.day===d.key).length);const max=Math.max(1,...counts);const hist=sessions.slice(-8).reverse();
    return `<div class="page-head"><div class="eyebrow">ТВОЯ ИСТОРИЯ</div><h1 style="margin-top:12px">Прогресс идёт<br><span style="color:var(--lime)">по твоему темпу.</span></h1><p>Теперь ПУЛЬС умеет считать не только мини-сессии, но и разные зоны тренировки.</p></div><div class="stats-grid"><div class="stat-card"><strong>${sessions.length}</strong><span>мини-сессий</span></div><div class="stat-card"><strong>${activeDays}</strong><span>активных дней</span></div><div class="stat-card"><strong>${doneTasks}</strong><span>выполненных упражнений</span></div></div><section class="section"><div class="section-heading"><div><h2>Последние 7 дней</h2><small>Занимался или выбирал отдых — всё считается</small></div></div><div class="card"><div class="week-grid">${days.map((d,i)=>`<div class="week-day ${d.today?'today':''}"><div class="week-column"><span class="${counts[i]?'active':''}" style="--height:${counts[i]?Math.round(counts[i]/max*100):7}%" title="${counts[i]} сессий"></span></div><span>${esc(d.name)}</span><span>${counts[i]?'●':'·'}</span></div>`).join('')}</div></div></section><section class="section"><div class="section-heading"><div><h2>Что ты чаще качаешь</h2><small>По последним сохранённым мини-сессиям</small></div></div><div class="card"><h3>${favoriteFocus()}</h3><p class="helper" style="margin-top:9px">Любимый фокус можно менять хоть каждый день: руки, пресс, грудь, ноги, спина или всё тело.</p></div></section><section class="section"><div class="section-heading"><div><h2>Дневник</h2><small>Твои последние сессии</small></div></div><div class="history">${hist.length?hist.map(s=>`<div class="history-item"><div><strong>${dayLabel(s.day)} · ${s.mode==='rest'?'Восстановление':s.mode==='light'?'Лёгкий старт':'Мини-тренировка'}</strong><small>${FOCUSES[s.focus||'full'].name} · ${LEVELS[s.level||'beginner'].name} · ${s.completed.length} из ${s.possible} · настроение ${MOODS[(s.mood||3)-1]?.emoji||'😐'}</small></div><span class="history-tag">${s.completed.length===0?'Отдых ✓':`${s.completed.length} ✓`}</span></div>`).join(''):`<div class="card empty">Тут появятся твои первые маленькие победы. Начни с одной зоны и одного упражнения 💚</div>`}</div></section><div class="insight-card"><div class="eyebrow">НАПОМИНАНИЕ</div><h2>Необязательно качать всё сразу.</h2><p>Сегодня можно выбрать бицепс или пресс, завтра — ноги. Главное, чтобы это было посильно и регулярно.</p></div>`;
  }

  function renderSettings(){
    return `<div class="page-head"><div class="eyebrow">НАСТРОЙКИ</div><h1 style="margin-top:12px">Всё <span style="color:var(--lime)">под тебя.</span></h1><p>Здесь можно быстро посмотреть текущий уровень и цель, а ещё сохранить или стереть данные.</p></div><section class="section" style="margin-top:6px"><div class="section-heading"><div><h2>Мой профиль нагрузки</h2><small>Эти параметры используются в плане на сегодня</small></div></div><div class="card"><div class="helper"><b>Уровень:</b> ${LEVELS[state.settings.level].name}<br><b>Фокус:</b> ${FOCUSES[state.settings.focus].name}</div><div class="recommendation"><span class="spark">✺</span><div><strong>Совет:</strong><br>Если упражнения кажутся слишком тяжёлыми, выбери уровень “Новичок”. Если слишком легко — “Заряжен”.</div></div></div></section><section class="section"><div class="section-heading"><div><h2>Мои данные</h2><small>Личная информация остаётся локально</small></div></div><div class="card"><h3>Без аккаунта и интернета</h3><p class="helper">Настроение, усталость, выбранные зоны тренировки и история занятий сохраняются только на этом устройстве. Удаление данных приложения может стереть историю.</p><button type="button" class="action-btn" data-action="export">↗ Сохранить мою историю (JSON)</button><button type="button" class="action-btn danger" data-action="reset">× Очистить все данные</button></div></section><p class="credits">ПУЛЬС v1.2 · Камера считает повторения<br>Это не медицинская диагностика или программа лечения.</p>`;
  }

  function render(){
    ensureToday();
    document.getElementById('headerDate').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
    main.innerHTML=view==='progress'?renderProgress():view==='settings'?renderSettings():renderToday();
    document.querySelectorAll('[data-view]').forEach(el=>{const active=el.dataset.view===view;el.classList.toggle('active',active);el.setAttribute('aria-current',active?'page':'false');});
  }

  function checkinPatch(patch){const key=dateKey();const prev=todayCheckin()||{mood:3,fatigue:1,note:''};state.checkins[key]={...prev,...patch};updateMode();save();render();}
  function stopTimer(){if(timer?.tickId)clearInterval(timer.tickId);timer=null;}
  function startTimer(id){const item=planFor(currentMode()).find(x=>x.id===id && x.duration);if(!item || state.progress.done.includes(id))return;if(timer && timer.id!==id)stopTimer();if(!timer){timer={id,remaining:item.duration,running:false,tickId:null,deadline:0};}if(timer.running){timer.remaining=Math.max(1,Math.ceil((timer.deadline-Date.now())/1000));clearInterval(timer.tickId);timer.tickId=null;timer.running=false;render();return;}timer.running=true;timer.deadline=Date.now()+timer.remaining*1000;timer.tickId=setInterval(()=>{if(!timer||!timer.running)return;timer.remaining=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));const clock=document.getElementById('timerClock');if(clock)clock.textContent=formatClock(timer.remaining);if(timer.remaining<=0){const doneId=timer.id;stopTimer();finishTask(doneId);}},175);render();}
  function finishTask(id){if(state.progress.status==='complete')return;const all=planFor(currentMode());const item=all.find(t=>t.id===id);if(!item)return;if(timer?.id===id)stopTimer();if(!state.progress.done.includes(id))state.progress.done.push(id);if(state.progress.done.length>=all.length){completeSession(false);return;}save();render();toast('Готово! Маленькая победа ✨');}
  window.pulseCounterResult=(id,count)=>{
    if(state.progress.status==='complete')return;
    const item=planFor(currentMode()).find(t=>t.id===id);
    if(!item)return;
    const safeCount=bounded(count,0,100,0);
    state.progress.partial=state.progress.partial||{};
    state.progress.partial[id]=Math.max(state.progress.partial[id]||0,safeCount);
    if(state.progress.partial[id]>=item.count){
      finishTask(id);
      toast(`Камера засчитала ${safeCount} повторений! 🎯`);
    }else{
      save();render();toast(`Камера распознала ${safeCount} из ${item.count}. Можно продолжить.`);
    }
  };
  function undoTask(id){if(state.progress.status==='complete')return;state.progress.done=state.progress.done.filter(x=>x!==id);save();render();}

  function completeSession(early){
    if(state.progress.status==='complete')return;
    stopTimer();
    const tasks=planFor(currentMode());
    const completed=tasks.filter(t=>state.progress.done.includes(t.id)).map(t=>({id:t.id,name:t.name,count:t.count}));
    const c=todayCheckin();
    const session={id:`${Date.now()}-${Math.random().toString(36).slice(2,6)}`,day:dateKey(),mode:currentMode(),focus:state.settings.focus,level:state.settings.level,completed,possible:tasks.length,endedAt:new Date().toISOString(),mood:c?.mood||3,fatigue:c?.fatigue||1};
    state.sessions.push(session);state.sessions=state.sessions.slice(-500);state.progress.status='complete';save();render();showModal(session,early);
  }

  function showModal(session,early){
    const rest=session.mode==='rest' || session.completed.length===0;
    overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><span class="celebrate" aria-hidden="true">${rest?'🌿':'🎉'}</span><h2 id="modalTitle">${rest?'Ты позаботился о себе':'Это победа!'}</h2><p>${rest?'Отдых и восстановление тоже важны. Сегодня этого достаточно.':early?'Ты сделал столько, сколько было комфортно. Это уже результат.':`Выполнено ${session.completed.length} мини-заданий по фокусу “${FOCUSES[session.focus].name}”. Всё начинается с первого шага!`}</p><button type="button" data-action="close-modal">Отлично!</button></div>`;
    overlay.hidden=false;overlay.querySelector('button').focus();
  }

  function exportData(){const payload=JSON.stringify({exportedAt:new Date().toISOString(),app:'ПУЛЬС 1.2',data:state},null,2);if(window.NativeBridge&&typeof window.NativeBridge.shareData==='function'){window.NativeBridge.shareData(payload);toast('Выбери приложение, чтобы сохранить данные');return;}const blob=new Blob([payload],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`pulse-history-${dateKey()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);toast('История экспортирована');}
  function resetData(){if(!confirm('Точно удалить всю историю, настройки и выбранные зоны тренировки? Отменить это действие нельзя.'))return;stopTimer();state=defaults();save();view='today';location.hash='today';render();toast('Все данные очищены');}

  function setRest(){
    if(state.progress.status==='complete')return;
    state.progress.manualRest=!state.progress.manualRest;
    if(state.progress.done.length>0){toast('Сначала закончи текущий мини-план, чтобы сменить режим');state.progress.manualRest=!state.progress.manualRest;return;}
    updateMode();save();render();
  }

  function setLevel(level){
    if(!LEVELS[level])return;
    if(state.progress.status!=='complete' && state.progress.done.length>0){toast('Смени уровень после завершения текущего подхода');return;}
    state.settings.level=level;state.progress.partial={};save();render();toast(`Уровень: ${LEVELS[level].name}`);
  }
  function setFocus(focus){
    if(!FOCUSES[focus])return;
    if(state.progress.status!=='complete' && state.progress.done.length>0){toast('Смени зону после завершения текущего подхода');return;}
    state.settings.focus=focus;state.progress.partial={};save();render();toast(`Фокус: ${FOCUSES[focus].name}`);
  }

  document.addEventListener('click',e=>{
    const navigation=e.target.closest('[data-view]');
    if(navigation){e.preventDefault();view=navigation.dataset.view;location.hash=view;stopTimer();render();scrollTo({top:0,behavior:'smooth'});return;}
    const mood=e.target.closest('[data-mood]');if(mood){checkinPatch({mood:Number(mood.dataset.mood)});return;}
    const level=e.target.closest('[data-level]');if(level){setLevel(level.dataset.level);return;}
    const focus=e.target.closest('[data-focus]');if(focus){setFocus(focus.dataset.focus);return;}
    const task=e.target.closest('[data-task]');if(task){const t=planFor(currentMode()).find(t=>t.id===task.dataset.task);if(t?.duration){startTimer(t.id);}else{finishTask(t?.id);}return;}
    const auto=e.target.closest('[data-autocount]');if(auto){
      const item=planFor(currentMode()).find(t=>t.id===auto.dataset.autocount);
      if(item&&window.NativeBridge?.startCounter){
        window.NativeBridge.startCounter(item.id,item.name,item.count,state.progress.partial?.[item.id]||0);
      }
      return;
    }
    const undo=e.target.closest('[data-undo]');if(undo){undoTask(undo.dataset.undo);return;}
    const timerButton=e.target.closest('[data-timer]');if(timerButton){startTimer(timerButton.dataset.timer);return;}
    const action=e.target.closest('[data-action]')?.dataset.action;
    switch(action){
      case 'toggle-rest':setRest();break;
      case 'finish-early':completeSession(true);break;
      case 'restart':state.progress={day:dateKey(),mode:deriveMode(),manualRest:false,done:[],partial:{},status:'open'};save();render();break;
      case 'export':exportData();break;
      case 'reset':resetData();break;
      case 'close-modal':overlay.hidden=true;overlay.innerHTML='';break;
    }
  });

  document.addEventListener('input',e=>{
    const el=e.target;
    if(el.id==='fatigueRange'){
      const val=bounded(el.value,0,4,1);document.getElementById('fatigueText').textContent=FATIGUE[val];document.getElementById('fatigueText').classList.toggle('warning',val>=3);el.style.setProperty('--range',`${val*25}%`);
    }
    if(el.id==='checkinNote'){const key=dateKey();state.checkins[key]={...(todayCheckin()||{mood:3,fatigue:1}),note:el.value.slice(0,160)};save();}
  });

  document.addEventListener('change',e=>{const el=e.target;if(el.id==='fatigueRange')checkinPatch({fatigue:bounded(el.value,0,4,1)});});
  window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['today','progress','settings'].includes(v)&&v!==view){view=v;stopTimer();render();}});
  window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(state.progress.day!==dateKey())render();if(timer?.running&&timer.deadline<=Date.now()){const id=timer.id;stopTimer();finishTask(id);}}});
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  render();
})();
</script>
</body>
</html>
